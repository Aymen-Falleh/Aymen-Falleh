<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 238" width="888" height="238" role="img" aria-label="Have an idea? Don't hesitate to contact me. Let's build it together.">
<defs>
<clipPath id="card"><rect width="860" height="210" rx="14"/></clipPath>
<linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9ac50" stop-opacity="0"/><stop offset=".5" stop-color="#e9ac50"/><stop offset="1" stop-color="#e9ac50" stop-opacity="0"/></linearGradient>
<filter id="neon" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<filter id="halo" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b" filterUnits="userSpaceOnUse" x="-300" y="-8" width="1800" height="32"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<g transform="translate(14 14)">
<rect x="1" y="1" width="858" height="208" rx="14" fill="none" stroke="#e9ac50" stroke-width="3" filter="url(#halo)" opacity=".5"><animate attributeName="opacity" values=".25;.85;.25" dur="2.8s" repeatCount="indefinite"/></rect>
<g clip-path="url(#card)">
<rect width="860" height="210" fill="#171a18"/>
<text x="28" y="38" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#aaa69e"><tspan fill="#ff8a1f" font-weight="700">$</tspan> ./build --together</text>
<rect x="212" y="25" width="8" height="16" fill="#e9ac50"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/></rect>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.9s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.2s" dur="0.9s" fill="freeze"/>
<text x="430.0" y="108" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="#e9ac50" filter="url(#glow)" opacity=".8">Have an idea?<animate attributeName="opacity" values=".4;.95;.4" dur="2.8s" repeatCount="indefinite"/></text>
<text x="430.0" y="108" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="800" fill="#f6efe4">Have an idea?</text>
</g>
<g opacity="0">
<animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.9s" fill="freeze"/>
<animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.9s" dur="0.9s" fill="freeze"/>
<text x="430.0" y="156" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#f6efe4">Don't hesitate to contact me, <tspan fill="#e9ac50" font-weight="700" filter="url(#neon)">let's build it together.</tspan></text>
</g>
<rect x="-260" y="196" width="260" height="4" fill="url(#s)" filter="url(#b)"><animate attributeName="x" from="-260" to="860" dur="4s" repeatCount="indefinite"/></rect>
<rect x="-260" y="197" width="260" height="2" fill="url(#s)"><animate attributeName="x" from="-260" to="860" dur="4s" repeatCount="indefinite"/></rect>
</g>
<rect x=".75" y=".75" width="858.5" height="208.5" rx="14" fill="none" stroke="#393b36" stroke-width="1.5"/>
</g>
</svg>
