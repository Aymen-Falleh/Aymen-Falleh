name: Profile animations

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch: # run it once by hand after the first commit
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-animations.yml"
      - "profile-3d-settings.json"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate snake and 3D contribution images
    steps:
      - uses: actions/checkout@v5

      # Snake eating the contribution graph (amber dark + warm light variants)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff8a1f&color_dots=#1c201e,#4a3a1b,#8a6628,#c98a2f,#e9ac50
            dist/snake-light.svg?color_snake=#c2570a&color_dots=#ece4d3,#f3d9a4,#eec06b,#e39a2e,#c2710f

      # 3D contribution skyline, amber on #101312
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: ./profile-3d-settings.json

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A dist profile-3d-contrib
          if git commit -m "chore: refresh profile animations"; then
            git push
          fi
